# XcodeGen spec. Generate with:  brew install xcodegen && xcodegen generate && open GoldenHour.xcodeproj
# Team, bundle id and app group come from Config/Secrets.xcconfig (DEVELOPMENT_TEAM, BUNDLE_ID_BASE).
name: GoldenHour
options:
  deploymentTarget: { iOS: "17.0" }
packages:
  GoldenHourCore:
    path: .
configFiles:                           # Copy Config/Secrets.example.xcconfig → Config/Secrets.xcconfig
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  GoldenHour:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Debug widget gallery (--widget-gallery) renders the widget views inside the app.
      - Widget/Provider.swift
      - Widget/WidgetViews.swift
      - Widget/PreviewData.swift
      - Widget/RingClockView.swift
      - Widget/SyncClockWidget.swift
    dependencies:
      - package: GoldenHourCore
      - target: GoldenHourWidget
    entitlements:
      path: Config/GoldenHour.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_ID_BASE)"]   # read by AppGroup.identifier via GH_APP_GROUP
    info:
      path: Config/GoldenHour-Info.plist
      properties:
        CFBundleDisplayName: Kairos
        NSSupportsLiveActivities: true
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GH_MEMBER_ID: $(GH_MEMBER_ID)
        GH_APP_GROUP: group.$(BUNDLE_ID_BASE)
        UILaunchScreen: {}
        NSAppTransportSecurity:   # Simulator demo mode talks to the local demo server over http
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_BASE)
            CFBundleURLSchemes: [goldenhour]
        NSCalendarsFullAccessUsageDescription: Kairos reads only when you're busy (start and end times) to find family times, and moves an event only when you tap "Move it". Titles, places and attendees never leave your phone.
        LSApplicationQueriesSchemes: [whatsapp, kakaotalk, weixin, line, tg, fb-messenger, instagram]   # only to grey out apps that aren't installed
        NSContactsUsageDescription: Kairos matches your family to your contacts so it can show their photos and call them with FaceTime audio. Your contacts stay on your phone and are never uploaded.
        # No usage-description keys for microphone, Focus or Photos: those features are not used.
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GH_APP_GALLERY
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
  GoldenHourWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: GoldenHourCore
    entitlements:
      path: Config/GoldenHourWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(BUNDLE_ID_BASE)"]
    info:
      path: Config/GoldenHourWidget-Info.plist
      properties:
        CFBundleDisplayName: Kairos
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GH_MEMBER_ID: $(GH_MEMBER_ID)
        GH_APP_GROUP: group.$(BUNDLE_ID_BASE)
        UIAppFonts: [SulphurPoint-Light.ttf, SulphurPoint-Regular.ttf, SulphurPoint-Bold.ttf]
        NSAppTransportSecurity:   # Simulator demo mode: the widget refreshes from the local demo server
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widget
schemes:
  GoldenHour:
    build:
      targets:
        GoldenHour: all
        GoldenHourWidget: all
    run:
      config: Debug
  GoldenHourWidget:
    build:
      targets:
        GoldenHourWidget: all
        GoldenHour: all
    run:
      config: Debug
      executable: GoldenHour
      environmentVariables:
        _XCWidgetKind: GoldenHourSyncClock
        _XCWidgetFamily: medium
