# XcodeGen spec. NOT verified in this environment (no Xcode here).
# Generate with:  brew install xcodegen && xcodegen generate && open GoldenHour.xcodeproj
name: GoldenHour
options:
  bundleIdPrefix: com.example          # change to your own
  deploymentTarget: { iOS: "17.0" }
packages:
  GoldenHourCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""               # set your team
targets:
  GoldenHour:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: GoldenHourCore
      - target: GoldenHourWidget
    entitlements:
      path: Config/GoldenHour.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.goldenhour]   # must equal AppGroup.identifier
    info:
      path: Config/GoldenHour-Info.plist
      properties:
        CFBundleDisplayName: Golden Hour
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.example.goldenhour
            CFBundleURLSchemes: [goldenhour]
        # No usage-description keys for contacts, microphone, Focus or Photos: those features are not used.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goldenhour
  GoldenHourWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: GoldenHourCore
    entitlements:
      path: Config/GoldenHourWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.goldenhour]
    info:
      path: Config/GoldenHourWidget-Info.plist
      properties:
        CFBundleDisplayName: Golden Hour
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goldenhour.widget
