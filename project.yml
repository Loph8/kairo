# XcodeGen spec. NOT verified in this environment (no Xcode here).
# Generate with:  brew install xcodegen && xcodegen generate && open Kairo.xcodeproj
name: Kairo
options:
  bundleIdPrefix: com.example          # change to your own
  deploymentTarget: { iOS: "17.0" }
packages:
  KairoCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""               # set your team
targets:
  Kairo:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: KairoCore
      - target: KairoWidget
    entitlements:
      path: Config/Kairo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.kairo]   # must equal AppGroup.identifier
    info:
      path: Config/Kairo-Info.plist
      properties:
        CFBundleDisplayName: Kairo
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.example.kairo
            CFBundleURLSchemes: [kairo]
        # No usage-description keys for contacts, microphone, Focus or Photos: those features are not used.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kairo
  KairoWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: KairoCore
    entitlements:
      path: Config/KairoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.kairo]
    info:
      path: Config/KairoWidget-Info.plist
      properties:
        CFBundleDisplayName: Kairo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kairo.widget
